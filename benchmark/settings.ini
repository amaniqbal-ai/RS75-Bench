# Settings - the defaults are the ones planned for the paper. Change only if needed.
hf_repo=aman2625/rs-data
# number of repeated linear-probe runs (different splits)
lp_runs=10
# models taken to the RAW labels (best per family: CNN and ViT)
raw_top_per_family=5
# models taken to fine-tuning (best per family), seeds and epochs
ft_top_per_family=2
ft_seeds=3
ft_epochs=10
ft_batch=64
# models with a native input bigger than this (pixels) are not fine-tuned (too slow)
ft_max_input=320
# Google Drive (name of the remote inside rclone.conf, and the top folder)
drive_remote=gdrive
drive_folder=Satellite
upload_every_min=10
progress_every_min=60
# augmentation top-up for classes that stayed below the target
topup_target=2000
topup_threshold=1400
# t-SNE / silhouette: real images sampled per class
tsne_per_class=40
